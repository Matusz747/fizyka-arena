
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fizyka Arena — Quiz fizyczny</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;
 background:#071426;color:#eaf7ff;
 font-family:Arial,sans-serif
}
.container{max-width:950px;margin:auto}
header{
 text-align:center;padding:25px;
 background:linear-gradient(135deg,#102d50,#07546b);
 border:1px solid #167e9b;border-radius:18px;
 margin-bottom:20px
}
h1{color:#55e5ff;margin:5px}
.subtitle{color:#b8dce9}
.stats{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:10px;margin:20px 0
}
.stat,.panel{
 background:#10243c;border:1px solid #244765;
 border-radius:14px;padding:16px
}
.stat{text-align:center}
.stat strong{display:block;font-size:25px;color:#55e5ff}
button{
 background:#087d9d;color:white;border:0;
 border-radius:10px;padding:12px 17px;
 font-weight:bold;cursor:pointer;margin:4px
}
button:hover{background:#0da6c9}
button:disabled{background:#34495b;color:#91a5b5;cursor:not-allowed}
.rank-grid{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
 gap:10px;margin-top:15px
}
.rank{
 background:#142c46;border:1px solid #31516c;
 border-radius:12px;padding:13px;text-align:left
}
.rank.unlocked{border-color:#20c9e8}
.rank.completed{border-color:#40d69a;background:#123b39}
.rank small{display:block;color:#a8c4d5;margin-top:6px}
.question{font-size:21px;line-height:1.5;margin:22px 0}
.answers{display:grid;gap:10px}
.answer{
 text-align:left;background:#183653;
 border:1px solid #315b7b;padding:15px
}
.answer.correct{background:#126044;border:2px solid #40d69a}
.answer.wrong{background:#702e3a;border:2px solid #ff7185}
.progress{
 height:12px;background:#263e54;border-radius:20px;overflow:hidden
}
.progress div{height:100%;background:#36d5ed;width:0}
.hidden{display:none}
#feedback{margin:15px 0;font-weight:bold;min-height:25px}
footer{text-align:center;color:#7898ac;margin-top:30px}
@media(max-width:550px){
 body{padding:10px}
 .stats{grid-template-columns:1fr}
 .question{font-size:18px}
}
</style>
</head>
<body>
<div class="container">

<header>
 <h1>⚡ FIZYKA ARENA</h1>
 <div class="subtitle">Wielka przygoda z fizyką — 50 rang i 1000 pytań!</div>
</header>

<div class="stats">
 <div class="stat">Punkty<strong id="points">0</strong></div>
 <div class="stat">Odblokowane rangi<strong id="unlocked">1/50</strong></div>
 <div class="stat">Ukończone rangi<strong id="completed">0/50</strong></div>
</div>

<section id="menu" class="panel">
 <h2>🏆 Wybierz rangę</h2>
 <p>Każda ranga zawiera 20 pytań. Aby przejść dalej, zdobądź 20/20.</p>
 <div class="rank-grid" id="rankGrid"></div>
</section>

<section id="game" class="panel hidden">
 <button onclick="backToMenu()">← Powrót do rang</button>
 <h2 id="rankTitle"></h2>
 <p id="questionNumber"></p>
 <div class="progress"><div id="progressBar"></div></div>
 <div class="question" id="question"></div>
 <div class="answers" id="answers"></div>
 <div id="feedback"></div>
 <button id="nextButton" class="hidden" onclick="nextQuestion()">Następne pytanie →</button>
</section>

<section id="result" class="panel hidden">
 <h2 id="resultTitle"></h2>
 <p id="resultText"></p>
 <button onclick="backToMenu()">Wróć do rang</button>
</section>

<footer>Fizyka Arena • Quiz edukacyjny</footer>
</div>

<script>
// =====================================
// USTAWIENIA
// =====================================

const TOTAL_RANKS = 50;
const QUESTIONS_PER_RANK = 20;
const POINTS_PER_QUESTION = 5;

const rankNames = [
 "Początkujący","Odkrywca","Uczeń Newtona","Młody Badacz",
 "Eksplorator Sił","Mistrz Ruchu","Łowca Energii",
 "Strażnik Fali","Elektronik","Analityk","Konstruktor",
 "Ekspert Mechaniki","Mistrz Grawitacji","Mistrz Ciepła",
 "Mistrz Elektryczności","Inżynier Fizyki","Naukowiec",
 "Profesor Eksperymentu","Wielki Odkrywca","Legenda Nauki"
];

let progress = JSON.parse(localStorage.getItem("physicsArenaProgress") || "{}");
let currentRank = 1;
let currentQuestion = 0;
let score = 0;
let questions = [];
let answered = false;

function saveProgress(){
 localStorage.setItem("physicsArenaProgress",JSON.stringify(progress));
}

function isUnlocked(rank){
 return rank === 1 || !!progress[rank-1]?.passed;
}

function isCompleted(rank){
 return !!progress[rank]?.passed;
}

function getPoints(){
 return Object.values(progress).reduce((sum,item)=>sum+(item.points||0),0);
}

// =====================================
// GENERATOR PYTAŃ
// Każda ranga ma inne wartości i pytania.
// =====================================

function makeQuestion(rank,index){
 const seed = rank * 37 + index * 13;
 const v = (base,step=1) => base + rank*step + index;
 let q,correct,wrong1,wrong2;

 switch(index){

 case 0:{
  let m=v(2),a=v(2);
  q=`Ciało o masie ${m} kg porusza się z przyspieszeniem ${a} m/s². Oblicz siłę wypadkową.`;
  correct=m*a+" N";
  wrong1=m+a+" N";wrong2=m*a*2+" N";
  break;
 }

 case 1:{
  let d=v(20,4),t=v(2);
  q=`Pojazd pokonał ${d} metrów w ${t} sekund. Oblicz średnią prędkość.`;
  correct=(d/t)+" m/s";
  wrong1=d*t+" m/s";wrong2=(d+t)+" m/s";
  break;
 }

 case 2:{
  let m=v(3),volume=v(2);
  q=`Przedmiot ma masę ${m*2} kg i objętość ${volume} m³. Oblicz gęstość.`;
  correct=(m*2/volume)+" kg/m³";
  wrong1=(m*2*volume)+" kg/m³";
  wrong2=(volume/(m*2))+" kg/m³";
  break;
 }

 case 3:{
  let f=v(12,2),area=v(2);
  q=`Siła ${f} N działa na powierzchnię ${area} m². Oblicz ciśnienie.`;
  correct=(f/area)+" Pa";
  wrong1=(f*area)+" Pa";wrong2=(area/f)+" Pa";
  break;
 }

 case 4:{
  let r=v(2),i=v(3);
  q=`Przez opornik ${r} Ω płynie prąd ${i} A. Oblicz napięcie.`;
  correct=(r*i)+" V";
  wrong1=(r/i)+" V";wrong2=(r+i)+" V";
  break;
 }

 case 5:{
  let f=v(5,2),d=v(3);
  q=`Siła ${f} N przesuwa ciało o ${d} m w swoim kierunku. Oblicz pracę.`;
  correct=(f*d)+" J";
  wrong1=(f+d)+" J";wrong2=(f/d)+" J";
  break;
 }

 case 6:{
  let power=v(10,3),time=v(2);
  q=`Urządzenie o mocy ${power} W pracuje przez ${time} sekund. Ile energii zużyje?`;
  correct=(power*time)+" J";
  wrong1=(power/time)+" J";wrong2=(power+time)+" J";
  break;
 }

 case 7:{
  let m=v(2);
  q=`Oblicz ciężar ciała o masie ${m} kg. Przyjmij g = 10 N/kg.`;
  correct=(m*10)+" N";
  wrong1=(m/10)+" N";wrong2=(m+10)+" N";
  break;
 }

 case 8:{
  let speed=v(3),time=v(4);
  q=`Rowerzysta porusza się z prędkością ${speed} m/s przez ${time} sekund. Jaką drogę pokona?`;
  correct=(speed*time)+" m";
  wrong1=(speed/time)+" m";wrong2=(speed+time)+" m";
  break;
 }

 case 9:{
  let mass=v(2),acc=v(3);
  q=`Na ciało o masie ${mass} kg działa siła ${mass*acc} N. Oblicz przyspieszenie.`;
  correct=acc+" m/s²";
  wrong1=(mass*acc)+" m/s²";wrong2=(mass/acc)+" m/s²";
  break;
 }

 case 10:{
  let frequency=v(2),time=v(3);
  q=`W czasie ${time} sekund wykonano ${frequency*time} drgań. Oblicz częstotliwość.`;
  correct=frequency+" Hz";
  wrong1=(frequency*time)+" Hz";wrong2=(time/frequency)+" Hz";
  break;
 }

 case 11:{
  let frequency=v(2);
  q=`Fala porusza się z prędkością 340 m/s. Jej częstotliwość wynosi ${frequency} Hz. Oblicz długość fali.`;
  correct=(340/frequency).toFixed(2)+" m";
  wrong1=(340*frequency)+" m";
  wrong2=(frequency/340).toFixed(3)+" m";
  break;
 }

 case 12:{
  let mass=v(2),height=v(3);
  q=`Ciało o masie ${mass} kg znajduje się na wysokości ${height} m. Oblicz energię potencjalną. Przyjmij g = 10 N/kg.`;
  correct=(mass*10*height)+" J";
  wrong1=(mass*height)+" J";wrong2=(mass+height*10)+" J";
  break;
 }

 case 13:{
  let mass=v(2),speed=v(2);
  q=`Ciało o masie ${mass} kg porusza się z prędkością ${speed} m/s. Oblicz energię kinetyczną.`;
  correct=(mass*speed*speed/2)+" J";
  wrong1=(mass*speed)+" J";wrong2=(mass*speed*speed)+" J";
  break;
 }

 case 14:{
  let u=v(4),i=v(2);
  q=`Urządzenie pracuje przy napięciu ${u} V i natężeniu ${i} A. Oblicz moc.`;
  correct=(u*i)+" W";
  wrong1=(u/i)+" W";wrong2=(u+i)+" W";
  break;
 }

 case 15:{
  let c=v(2),mass=v(3);
  q=`Substancja ma masę ${mass} kg i ciepło właściwe ${c*100} J/(kg·°C). Ile energii potrzeba na ogrzanie jej o 1°C?`;
  correct=(mass*c*100)+" J";
  wrong1=(mass+c*100)+" J";wrong2=(c*100/mass)+" J";
  break;
 }

 case 16:{
  let time=v(2);
  q=`Echo wróciło po ${time*2} sekundach. Prędkość dźwięku wynosi 340 m/s. Jak daleko znajduje się przeszkoda?`;
  correct=(340*time)+" m";
  wrong1=(340*time*2)+" m";wrong2=(time/340)+" m";
  break;
 }

 case 17:{
  let r=v(2),u=v(3);
  q=`Na oporniku ${r} Ω panuje napięcie ${u*r} V. Oblicz natężenie prądu.`;
  correct=u+" A";
  wrong1=(u*r)+" A";wrong2=(r/u)+" A";
  break;
 }

 case 18:{
  let mass=v(2),speed=v(3);
  q=`Ciało o masie ${mass} kg porusza się z prędkością ${speed} m/s. Oblicz jego pęd.`;
  correct=(mass*speed)+" kg·m/s";
  wrong1=(mass/speed)+" kg·m/s";
  wrong2=(mass+speed)+" kg·m/s";
  break;
 }

 default:{
  let p=v(5,3),t=v(2);
  q=`Silnik o mocy ${p} W pracuje przez ${t} sekund. Oblicz wykonaną pracę.`;
  correct=(p*t)+" J";
  wrong1=(p/t)+" J";wrong2=(p+t)+" J";
 }
 }

 let answers=[correct,wrong1,wrong2];

 // Deterministyczna zmiana położenia poprawnej odpowiedzi
 let shift=seed%3;
 answers=answers.slice(shift).concat(answers.slice(0,shift));

 return {
  q:q,
  a:answers,
  correct:answers.indexOf(correct)
 };
}

// =====================================
// GENEROWANIE RANG
// =====================================

const rankTests=Array.from({length:TOTAL_RANKS},(_,r)=>({
 name:`Ranga ${r+1} — ${rankNames[r%rankNames.length]}`,
 questions:Array.from({length:QUESTIONS_PER_RANK},(_,i)=>makeQuestion(r+1,i))
}));

// =====================================
// MENU RANG
// =====================================

function renderMenu(){
 const grid=document.getElementById("rankGrid");
 grid.innerHTML="";

 for(let r=1;r<=TOTAL_RANKS;r++){
  const unlocked=isUnlocked(r);
  const completed=isCompleted(r);

  const button=document.createElement("button");
  button.className="rank "+(completed?"completed":unlocked?"unlocked":"");
  button.disabled=!unlocked;

  button.innerHTML=`
   <strong>${completed?"🏆":unlocked?"⚡":"🔒"} Ranga ${r}</strong>
   <small>${rankNames[(r-1)%rankNames.length]}</small>
   <small>${completed?"Ukończona":unlocked?"20 pytań":"Zablokowana"}</small>
  `;

  button.onclick=()=>startRank(r);
  grid.appendChild(button);
 }

 document.getElementById("points").textContent=getPoints();
 document.getElementById("unlocked").textContent=
  (Object.keys(progress).filter(r=>progress[r].passed).length+1>50?50:
  Object.keys(progress).filter(r=>progress[r].passed).length+1)+"/50";
 document.getElementById("completed").textContent=
  Object.values(progress).filter(x=>x.passed).length+"/50";
}

// =====================================
// START RANGI
// =====================================

function startRank(rank){
 if(!isUnlocked(rank))return;

 currentRank=rank;
 currentQuestion=0;
 score=0;
 questions=rankTests[rank-1].questions;

 document.getElementById("menu").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");

 document.getElementById("rankTitle").textContent=
  rankTests[rank-1].name;

 showQuestion();
}

// =====================================
// WYŚWIETLANIE PYTANIA
// =====================================

function showQuestion(){
 answered=false;

 const item=questions[currentQuestion];

 document.getElementById("questionNumber").textContent=
  `Pytanie ${currentQuestion+1}/20 • Punkty: ${score}`;

 document.getElementById("progressBar").style.width=
  (currentQuestion/20*100)+"%";

 document.getElementById("question").textContent=item.q;

 document.getElementById("feedback").textContent="";
 document.getElementById("nextButton").classList.add("hidden");

 const answers=document.getElementById("answers");
 answers.innerHTML="";

 item.a.forEach((answer,index)=>{
  const button=document.createElement("button");
  button.className="answer";
  button.textContent=String.fromCharCode(65+index)+". "+answer;
  button.onclick=()=>checkAnswer(index,button);
  answers.appendChild(button);
 });
}

// =====================================
// SPRAWDZANIE ODPOWIEDZI
// =====================================

function checkAnswer(selected,button){
 if(answered)return;
 answered=true;

 const item=questions[currentQuestion];
 const buttons=document.querySelectorAll(".answer");

 buttons.forEach((b,i)=>{
  b.disabled=true;
  if(i===item.correct)b.classList.add("correct");
 });

 if(selected===item.correct){
  score+=POINTS_PER_QUESTION;
  document.getElementById("feedback").textContent=
   "✅ Dobrze! +5 punktów.";
 }else{
  button.classList.add("wrong");
  document.getElementById("feedback").textContent=
   "❌ Nie tym razem. Poprawna odpowiedź została zaznaczona.";
 }

 document.getElementById("questionNumber").textContent=
  `Pytanie ${currentQuestion+1}/20 • Punkty: ${score}`;

 document.getElementById("nextButton").classList.remove("hidden");
}

// =====================================
// NASTĘPNE PYTANIE
// =====================================

function nextQuestion(){
 currentQuestion++;

 if(currentQuestion>=QUESTIONS_PER_RANK){
  finishRank();
 }else{
  showQuestion();
 }
}

// =====================================
// KONIEC RANGI
// =====================================

function finishRank(){
 document.getElementById("game").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");

 const passed=score===100;
 const previous=progress[currentRank];

 progress[currentRank]={
  passed:passed || !!previous?.passed,
  points:Math.max(score,previous?.points||0)
 };

 saveProgress();

 if(passed){
  document.getElementById("resultTitle").textContent="🏆 RANGA ZDOBYTA!";
  document.getElementById("resultText").textContent=
   currentRank===50
   ?"Gratulacje! Ukończono wszystkie 50 rang i 1000 pytań. Jesteś Legendą Fizyki!"
   :"Gratulacje! Zdobywasz 20/20 i odblokowujesz kolejną rangę!";
 }else{
  document.getElementById("resultTitle").textContent="📚 RANGA NIEZALICZONA";
  document.getElementById("resultText").textContent=
   `Twój wynik: ${score/5}/20. Potrzebujesz 20/20, aby odblokować następną rangę. Możesz spróbować ponownie.`;
 }

 renderMenu();
}

// =====================================
// POWRÓT DO MENU
// =====================================

function backToMenu(){
 document.getElementById("game").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 document.getElementById("menu").classList.remove("hidden");
 renderMenu();
}

renderMenu();
</script>
</body>
</html>
